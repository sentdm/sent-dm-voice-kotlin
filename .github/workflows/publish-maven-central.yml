# Runs when release-please publishes a release, and by hand to publish again if a run failed.
# https://www.github.com/sentdm/sent-dm-voice-kotlin/actions/workflows/publish-maven-central.yml
name: Publish Maven Central
on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: publish-maven-central
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Publish to Maven Central
        # The plugin reads the signing key and the Portal token from Gradle properties; the
        # ORG_GRADLE_PROJECT_ prefix turns an environment variable into one. The key is the
        # ASCII-armored secret key; with no subkeys it needs no key id.
        run: ./gradlew publishAndReleaseToMavenCentral --stacktrace --no-configuration-cache --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}

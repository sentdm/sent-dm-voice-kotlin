name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  core:
    name: core
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check the generated contract
        run: scripts/check-contract
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build and test
        # The core's tests, and the Android library assembled against the provider's SDK.
        run: ./gradlew :voice-client-core:check :voice-client:assembleRelease --no-daemon
      - name: Check the publications build
        # Everything publishAndReleaseToMavenCentral would upload, built into a local folder: no signing,
        # no credentials, so a broken POM or a missing sources jar fails here, not on release day.
        run: ./gradlew publishAllPublicationsToLocalFileSystemRepository -PpublishLocal --no-daemon && find build/local-maven-repo -name '*.pom' | sed 's#build/local-maven-repo/##'
